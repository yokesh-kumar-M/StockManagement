services:
  - type: web
    name: stock-manager-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn stockmanagement.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stock-manager-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "stock-manager-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://stock-manager.vercel.app"
      - key: DJANGO_LOG_LEVEL
        value: "WARNING"
    healthCheckPath: /api/v1/health/
    autoDeploy: true
