[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = migrations, .git, __pycache__, staticfiles

[isort]
profile = black
known_django = django, rest_framework
known_third_party = yfinance, matplotlib
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[tool:pytest]
DJANGO_SETTINGS_MODULE = stockmanagement.settings
